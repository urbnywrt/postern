  <body>
    <h1>Postern UI not built</h1>
    <p>
      This panel was built without its web interface. The API under <code>/api</code> works.
    </p>
    <p>
      To get the interface, run <code>npm ci &amp;&amp; npm run build</code> in <code>web/</code>, copy
      <code>web/dist/</code> into <code>internal/panel/webui/dist/</code> and build the panel again.
      The Docker image does all of that.
    </p>
