[general]
use_middle_proxy = true
log_level = "silent"
data_path = "/etc/telemt/data"
ad_tag = "0123456789abcdef0123456789abcdef"
middle_proxy_nat_ip = "203.0.113.10"
middle_proxy_nat_probe = false
fast_mode = true
me_writer_pick_mode = "p2c"
tg_connect = 10
rst_on_close = "off"
update_every = 30

[general.modes]
classic = false
secure = false
tls = true

[general.links]
show = []

[network]
stun_use = false
http_ip_detect_urls = []

[server]
proxy_protocol_trusted_cidrs = ["127.0.0.1/32"]

[[server.listeners]]
ip = "127.0.0.1"
port = 20123
proxy_protocol = true

[server.api]
enabled = true
listen = "127.0.0.1:25123"
whitelist = ["127.0.0.1/32"]
auth_header = "api-token-api-token"

[censorship]
tls_domain = "www.example.com"
mask = true
tls_emulation = true
mask_host = "mask.example.com"
mask_port = 8443
tls_fetch_scope = "fetch"

[access.users]
p = "00112233445566778899aabbccddeeff"

[[upstreams]]
type = "socks5"
address = "127.0.0.1:30123"

[[upstreams]]
type = "socks5"
address = "127.0.0.1:30123"
scopes = "me, fetch"
